<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COFFEECUP — Specialty Coffee Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F6F2;--sf:#fff;--sf2:#F2E9DC;--tx:#171717;--mu:#5f5a54;--ln:#d8c5ae;--cu:#8f5420;--cb:#D18A4A;--hd:"Barlow Condensed","Arial Narrow",sans-serif;--bd:"Barlow",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090909;--sf:#171717;--sf2:#242424;--tx:#F2E9DC;--mu:#929292;--ln:#333;--cu:#D18A4A}}
:root[data-theme="dark"]{--bg:#090909;--sf:#171717;--sf2:#242424;--tx:#F2E9DC;--mu:#929292;--ln:#333;--cu:#D18A4A}
:root[lang=ar]{--hd:"Cairo",sans-serif;--bd:"Cairo",sans-serif}
:root[lang=ar] *{letter-spacing:0!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.55 var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cb);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.bar,.hero,section{max-width:1120px;margin:0 auto}
.bar{padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font:700 1.7rem var(--hd);letter-spacing:.05em;color:var(--tx);text-decoration:none}.logo b{color:var(--cu)}
nav{margin-inline-start:auto;display:flex;align-items:center;gap:14px}
nav a{color:var(--tx);text-decoration:none;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--cb);color:#090909;border:1px solid var(--cb);border-radius:6px;padding:.65rem 1.1rem;font:600 1rem var(--bd);cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--tx);border-color:var(--ln)}
.w{width:100%}
#cnt{display:inline-grid;place-items:center;min-width:1.5rem;height:1.5rem;border-radius:99px;background:#090909;color:#F2E9DC;font-size:.85rem}
.hero{padding:56px 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.hero>div{animation:up .7s both}.hero>div+div{animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
h1{font:700 clamp(3rem,8.5vw,6rem)/.92 var(--hd);text-transform:uppercase;margin:0 0 .35em}
.lead{color:var(--mu);font-size:1.15rem;max-width:32ch;margin:0 0 1.5rem}
.lc{background:#000;border-radius:14px;padding:22px;border:1px solid #49331f}
.lc img{width:100%;height:auto;display:block}
section{padding:40px 20px}
h2{font:700 2.4rem/1 var(--hd);text-transform:uppercase;margin:0 0 18px}
.tools{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.chips{flex-basis:100%;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:99px;padding:.4rem .95rem;cursor:pointer;white-space:nowrap;font:500 .95rem var(--bd)}
.chip[aria-pressed=true]{background:var(--cb);border-color:var(--cb);color:#090909}
input:not([type=radio]),textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:.6rem .8rem;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--cb)}
.art{aspect-ratio:4/3;background:var(--sf2);display:grid;place-items:center;color:var(--cu)}
.art svg{width:36%;height:auto}
.art.sm{width:48px;height:48px;aspect-ratio:auto;border-radius:6px}.art.sm svg{width:60%}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font:700 1.35rem var(--hd);margin:0}.cb p{color:var(--mu);margin:0;font-size:.92rem;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mu{color:var(--mu);font-size:.9rem}.tag{color:var(--mu);font-weight:600}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.three>div{border-top:2px solid var(--cb);padding-top:14px}
.three h3{font:700 1.5rem var(--hd);margin:0 0 6px}.three p{margin:0;color:var(--mu)}
footer{border-top:1px solid var(--ln);padding:28px 20px;text-align:center;color:var(--mu);font-size:.9rem}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:0;width:min(480px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog.dr{margin-block:0;margin-inline:auto 0;height:100%;max-height:100%;border-radius:0;width:min(420px,100%)}
.pad{padding:20px;display:grid;gap:14px;align-content:start}
.g{display:grid;gap:14px}
.x{padding:.3rem .75rem}
.opts{display:flex;flex-wrap:wrap;gap:8px;border:0;padding:0;margin:0}
.opts label{position:relative;border:1px solid var(--ln);border-radius:6px;padding:.45rem .8rem;cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label:has(:checked){background:var(--cb);border-color:var(--cb);color:#090909}
.opts label:has(:focus-visible){outline:2px solid var(--cb);outline-offset:2px}
fieldset{border:0;padding:0;margin:0}legend{font-weight:600;margin-bottom:6px;padding:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--ln);border-radius:6px}
.qty b{min-width:1.8rem;text-align:center}
.qty button{background:none;border:0;color:var(--tx);width:34px;height:34px;font-size:1.2rem;cursor:pointer}
.li{display:grid;grid-template-columns:48px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.lnk{background:none;border:0;color:var(--cu);cursor:pointer;text-decoration:underline;font:inherit;padding:4px 8px}
.f{display:grid;gap:4px;font-weight:500}
#er{margin:0;font-weight:600;color:var(--cu)}
pre{white-space:pre-wrap;background:var(--sf2);padding:10px;border-radius:6px;font-size:.8rem;direction:ltr;text-align:left;margin:0}
.sk{min-height:280px;background:linear-gradient(90deg,var(--sf),var(--sf2),var(--sf));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-width:420px}
.steps li{padding:.55rem .9rem;border:1px solid var(--ln);border-radius:6px;color:var(--mu)}
.steps li.done{color:var(--tx)}.steps li.now{background:var(--cb);border-color:var(--cb);color:#090909;font-weight:600}
.cx{color:var(--cu);font-weight:600}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:28px}.lc{order:-1;max-width:340px}}
@media(max-width:560px){nav a{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#top" aria-label="COFFEECUP">COFFEE<b>CUP</b></a>
<nav><a href="#menu" data-i="nMenu"></a><a href="#about" data-i="nAbout"></a><a href="#track" data-i="nTrack"></a>
<button class="btn ghost" id="lg" aria-label="Language / اللغة">ع</button>
<button class="btn" id="cartBtn"><span data-i="cart"></span><b id="cnt" aria-live="polite">0</b></button></nav>
</div></header>
<main id="top">
<div class="hero">
<div><h1 data-i="h1"></h1><p class="lead" data-i="lead"></p><a class="btn" href="#menu" data-i="order"></a></div>
<div class="lc"><img src="/assets/coffeecup-logo.png" alt="COFFEECUP coffee shop logo" width="720" height="480"></div>
</div>
<section id="menu"><h2 data-i="menu"></h2>
<div class="tools"><input type="search" id="q" style="max-width:320px"><div class="chips" id="chips"></div></div>
<div class="grid" id="grid"></div></section>
<section id="about"><h2 data-i="nAbout"></h2>
<div class="three"><div><h3 data-i="s1"></h3><p data-i="d1"></p></div><div><h3 data-i="s2"></h3><p data-i="d2"></p></div><div><h3 data-i="s3"></h3><p data-i="d3"></p></div></div></section>
<section id="track"><h2 data-i="nTrack"></h2>
<form id="tf" class="g" style="max-width:420px" novalidate>
<label class="f"><span data-i="tRef"></span><input name="ref" autocomplete="off" style="direction:ltr"></label>
<label class="f"><span data-i="fPhone"></span><input name="phone" type="tel" inputmode="tel"></label>
<button class="btn" data-i="tGo"></button></form>
<div id="tr" aria-live="polite" style="margin-top:16px"></div></section>
</main>
<footer data-i="foot"></footer>

<dialog id="pd"><div class="pad" id="pdb"></div></dialog>

<dialog id="cd" class="dr"><div class="pad">
<div class="row"><h2 style="font-size:2rem;margin:0" data-i="cart"></h2><button class="btn ghost x" id="cx" aria-label="Close">×</button></div>
<div id="cv"><div id="cl"></div>
<div class="row" style="margin-top:14px"><input id="dc" style="direction:ltr" autocomplete="off"><button class="btn ghost" id="da" data-i="apply"></button></div>
<p class="mu" id="dm" style="margin:6px 0 0"></p>
<div class="row mu" id="dl" hidden style="margin-top:10px"><span data-i="disc"></span><span id="dv"></span></div>
<div class="row" style="margin:10px 0 14px"><b data-i="total"></b><b id="tt"></b></div>
<button class="btn w" id="go" data-i="co"></button></div>
<form id="co" class="g" hidden novalidate>
<label class="f"><span data-i="fName"></span><input name="name" autocomplete="name" required></label>
<label class="f"><span data-i="fPhone"></span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" required></label>
<fieldset class="opts"><label><input type="radio" name="type" value="pickup" checked><span data-i="pick"></span></label><label id="dlv"><input type="radio" name="type" value="delivery"><span data-i="del"></span></label></fieldset>
<p class="mu" id="di" hidden style="margin:0"></p>
<label class="f" id="adr" hidden><span data-i="fAddr"></span><textarea name="addr" rows="2" autocomplete="street-address"></textarea></label>
<label class="f"><span data-i="fNote"></span><textarea name="notes" rows="2"></textarea></label>
<p class="mu" style="margin:0" data-i="pay"></p>
<p id="er" role="alert"></p>
<div class="row"><button type="button" class="btn ghost" id="bk" data-i="back"></button><button class="btn" id="sb" data-i="place"></button></div>
</form>
</div></dialog>

<script>
const S={
nMenu:['Menu','القائمة'],nAbout:['About','عن المقهى'],cart:['Cart','السلة'],
h1:['Good coffee, made properly.','قهوة جيدة، تُحضَّر كما يجب.'],
lead:['Espresso, signature drinks and fresh bakes. Order it your way.','إسبريسو ومشروبات مميزة ومخبوزات طازجة. اطلبها كما تحب.'],
order:['Order now','اطلب الآن'],menu:['Menu','القائمة'],ph:['Search the menu','ابحث في القائمة'],all:['All','الكل'],
none:['Nothing matches that search.','لا توجد نتائج مطابقة.'],sold:['Sold out','نفدت'],from:['From','من'],
cust:['Customize','تخصيص'],addS:['Add','أضف'],add:['Add to cart','أضف إلى السلة'],
empty:['Your cart is empty.','سلتك فارغة.'],total:['Total','المجموع'],co:['Checkout','إتمام الطلب'],back:['Back','رجوع'],rm:['Remove','إزالة'],
fName:['Name','الاسم'],fPhone:['Phone','رقم الهاتف'],pick:['Pickup','استلام'],del:['Delivery','توصيل'],
fAddr:['Delivery address','عنوان التوصيل'],fNote:['Notes (optional)','ملاحظات (اختياري)'],
pay:['Payment: cash on pickup or delivery.','الدفع: نقدًا عند الاستلام أو التوصيل.'],place:['Place order','أرسل الطلب'],
eReq:['Fill in the highlighted field.','املأ الحقل المحدد.'],ePh:['Enter a valid phone number.','أدخل رقم هاتف صحيحًا.'],
noapi:['Order not sent. The ordering API isn’t connected yet, so nothing was saved. This is the data it would receive:','لم يُرسل الطلب. واجهة الطلبات غير متصلة بعد، ولم يُحفظ شيء. هذه هي البيانات التي ستستقبلها:'],
fail:['The server could not take the order. Try again.','تعذّر على الخادم استلام الطلب. حاول مرة أخرى.'],
ok:['Order confirmed. Reference:','تم تأكيد الطلب. الرقم المرجعي:'],
s1:['Made to order','يُحضَّر عند الطلب'],d1:['Every drink is made after you order it.','كل مشروب يُحضَّر بعد أن تطلبه.'],
s2:['Your milk, your way','حليبك كما تحب'],d2:['Oat, almond or soy, plus extra shots. The price updates as you choose.','شوفان أو لوز أو صويا، مع جرعات إضافية. يتغير السعر أثناء اختيارك.'],
s3:['Pickup or delivery','استلام أو توصيل'],d3:['Collect it at the counter or have it brought to you.','استلمه من المقهى أو نوصله إليك.'],
foot:['COFFEECUP is a concept project. Every product, price and piece of text here is demo content.','COFFEECUP مشروع تجريبي. كل المنتجات والأسعار والنصوص هنا محتوى تجريبي.']};
const sv=(b)=>'<svg viewBox="0 0 64 64" aria-hidden="true">'+b+'</svg>';
const G={cup:sv('<path fill="currentColor" d="M10 26h36v12a14 14 0 0 1-14 14h-8a14 14 0 0 1-14-14z"/><path fill="none" stroke="currentColor" stroke-width="4" d="M46 30h3a6 6 0 0 1 0 12h-5"/><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M22 8c-4 5 4 7 0 13M32 8c-4 5 4 7 0 13"/>'),
glass:sv('<path fill="currentColor" d="M16 16h32l-4 42H20z"/><path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" d="M38 4l-3 14"/>'),
bake:sv('<ellipse cx="32" cy="44" rx="26" ry="9" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" d="M12 38c4-18 36-18 40 0"/>')};
const gl=c=>G[c==='iced'?'glass':['desserts','bakery','offers'].includes(c)?'bake':'cup'];

// The publishable key is meant for browsers. Row Level Security in the database is what protects the data.
const API_BASE=location.origin;
Object.assign(S,{
nTrack:['Track order','تتبع الطلب'],tRef:['Order reference','رقم الطلب'],tGo:['Track','تتبع'],
apply:['Apply','تطبيق'],dc:['Discount code','رمز الخصم'],disc:['Discount','الخصم'],size:['Size','الحجم'],noOpt:['None','بدون'],
loadErr:['Could not load the menu.','تعذّر تحميل القائمة.'],retry:['Try again','أعد المحاولة'],
itemGone:['An item is unavailable or out of stock. The menu was refreshed, so check your cart and try again.','أحد المنتجات غير متوفر أو نفد. تم تحديث القائمة، راجع سلتك وحاول مرة أخرى.'],
dMin:['Delivery needs a higher minimum order.','التوصيل يحتاج حدًا أدنى أعلى للطلب.'],
dInfo:['Delivery fee','رسوم التوصيل'],min:['minimum order','الحد الأدنى للطلب'],
noDisc:['That code is not valid.','هذا الرمز غير صالح.'],discMin:['Your order is below the minimum for this code.','طلبك أقل من الحد الأدنى لهذا الرمز.'],
notFound:['No order matches that reference and phone.','لا يوجد طلب مطابق لهذا الرقم والهاتف.'],
keep:['Keep this reference to track your order.','احتفظ بهذا الرقم لتتبع طلبك.'],
st_new:['New','جديد'],st_confirmed:['Confirmed','مؤكد'],st_preparing:['Preparing','قيد التحضير'],st_ready:['Ready','جاهز'],
st_out_for_delivery:['Out for delivery','في الطريق'],st_completed:['Completed','مكتمل'],st_cancelled:['Cancelled','ملغي']});

const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)];
let lang='en',cat='all',q='',cart=[],saved=[],cur,sel,qty,PR=[],CATS=[],cfg={},loading=true,failed=false,err='',dcode=null,disc=0,tm;
try{lang=localStorage.getItem('cc_l')||'en';saved=JSON.parse(localStorage.getItem('cc_c2')||'[]')}catch(e){}
const ar=()=>lang==='ar',s=k=>S[k][+ar()],pick=a=>a[+ar()];
// Money is handled in fils (1 JD = 1000 fils), matching the database's numeric(10,3).
const fils=x=>Math.round(+x*1000);
const m=c=>{const v=(c/1000).toFixed(3).replace(/0$/,'');return ar()?v+' د.أ':'JD '+v};
const api=async(path,body)=>{
 const r=await fetch(API_BASE+'/api/rest/v1/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},cache:'no-store',body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>null);
 if(!r.ok)throw new Error(((j&&j.message)||'http_'+r.status)+(j&&j.hint?' ('+j.hint+')':''));return j};

const by=(a,b)=>a.sort_order-b.sort_order;
async function load(){loading=true;failed=false;grid();
 try{const[c,p,st]=await Promise.all([
  api('categories?select=slug,name_en,name_ar,sort_order&order=sort_order'),
  api('products?select=id,name_en,name_ar,description_en,description_ar,base_price,is_available,sort_order,categories(slug),product_variants(id,name_en,name_ar,price_delta,is_default,sort_order),option_groups(id,name_en,name_ar,is_required,sort_order,product_options(id,name_en,name_ar,price_delta,is_default,is_available,sort_order))&order=sort_order'),
  api('store_settings?select=key,value')]);
  CATS=c.map(x=>[x.slug,[x.name_en,x.name_ar]]);
  PR=p.map(r=>({id:r.id,c:r.categories.slug,n:[r.name_en,r.name_ar],d:[r.description_en,r.description_ar],p:fils(r.base_price),ok:r.is_available,
   sz:r.product_variants.sort(by).map(v=>({id:v.id,n:[v.name_en,v.name_ar],d:fils(v.price_delta),def:v.is_default})),
   gr:r.option_groups.sort(by).map(g=>({k:g.id,n:[g.name_en,g.name_ar],req:g.is_required,
    o:g.product_options.filter(o=>o.is_available).sort(by).map(o=>({id:o.id,n:[o.name_en,o.name_ar],d:fils(o.price_delta),def:o.is_default}))})).filter(g=>g.o.length)}));
  st.forEach(x=>cfg[x.key]=x.value);
  cart=cart.concat(saved);saved=[];
  cart=cart.filter(i=>{const p=prod(i.id);return p&&p.ok})}
 catch(e){failed=true;err=e.message;console.error('Menu load failed:',e)}
 loading=false;chips();grid();paint();info()}

const prod=id=>PR.find(p=>p.id===id);
const price=(p,o)=>p.p+((p.sz.find(v=>v.id===o.size)||{}).d||0)+p.gr.reduce((t,g)=>t+((g.o.find(x=>x.id===o[g.k])||{}).d||0),0);
const lineP=i=>price(prod(i.id),i.o)*i.q;
const subtotal=()=>cart.reduce((t,i)=>t+lineP(i),0);
const summ=i=>{const p=prod(i.id);return [(p.sz.find(v=>v.id===i.o.size)||{}).n,...p.gr.map(g=>(g.o.find(x=>x.id===i.o[g.k])||{}).n)].filter(Boolean).map(pick).join(' · ')};

function chips(){$('#chips').innerHTML=[['all',S.all],...CATS].map(([k,n])=>`<button class="chip" data-c="${k}" aria-pressed="${k===cat}">${pick(n)}</button>`).join('')}
function grid(){const g=$('#grid');g.setAttribute('aria-busy',loading);
 if(loading){g.innerHTML='<div class="card sk"></div>'.repeat(8);return}
 if(failed){g.innerHTML=`<div><p>${s('loadErr')}</p><p class="mu er" dir="ltr" style="text-align:start;word-break:break-word"></p><button class="btn" id="rt">${s('retry')}</button></div>`;g.querySelector('.er').textContent=err;return}
 const t=q.trim().toLowerCase();
 const r=PR.filter(p=>(cat==='all'||p.c===cat)&&(!t||(p.n[0]+p.n[1]+p.d[0]+p.d[1]).toLowerCase().includes(t)));
 g.innerHTML=r.length?r.map(p=>`<article class="card"><div class="art">${gl(p.c)}</div><div class="cb"><h3>${pick(p.n)}</h3><p>${pick(p.d)}</p><div class="row"><span class="price">${s('from')} ${m(p.p)}</span>${p.ok?`<button class="btn" data-p="${p.id}">${s(p.sz.length||p.gr.length?'cust':'addS')}</button>`:`<span class="tag">${s('sold')}</span>`}</div></div></article>`).join(''):`<p>${s('none')}</p>`}
function paint(){const n=cart.reduce((t,i)=>t+i.q,0);$('#cnt').textContent=n;
 $('#cl').innerHTML=cart.length?cart.map((i,x)=>{const p=prod(i.id);return `<div class="li"><div class="art sm">${gl(p.c)}</div><div><b>${pick(p.n)}</b><div class="mu">${summ(i)}</div><div class="qty"><button data-a="${x}" data-d="-1" aria-label="−">−</button><b>${i.q}</b><button data-a="${x}" data-d="1" aria-label="+">+</button></div><button class="lnk" data-r="${x}">${s('rm')}</button></div><b>${m(lineP(i))}</b></div>`}).join(''):`<p>${s('empty')}</p>`;
 $('#dl').hidden=!disc;$('#dv').textContent='− '+m(disc);
 $('#tt').textContent=m(Math.max(subtotal()-disc,0));$('#go').disabled=!cart.length}
function info(){const d=cfg.delivery||{};
 $('#di').textContent=`${s('dInfo')}: ${m(fils(d.fee||0))} · ${s('min')}: ${m(fils(d.min_order||0))}`;$('#dlv').hidden=d.enabled===false}
function lng(){document.documentElement.lang=lang;document.documentElement.dir=ar()?'rtl':'ltr';
 $$('[data-i]').forEach(e=>e.textContent=s(e.dataset.i));
 $('#q').placeholder=s('ph');$('#q').setAttribute('aria-label',s('ph'));$('#dc').placeholder=s('dc');$('#lg').textContent=ar()?'EN':'ع';
 chips();grid();paint();info()}
const save=()=>{try{localStorage.setItem('cc_c2',JSON.stringify(cart))}catch(e){}dcode=null;disc=0;$('#dm').textContent='';paint()};

const upd=()=>{$('#qv').textContent=qty;$('#ad').textContent=`${s('add')} · ${m(price(cur,sel)*qty)}`};
const grp=(k,title,list,none)=>`<fieldset><legend>${title}</legend><div class="opts">${(none?[{id:'',n:S.noOpt,d:0}]:[]).concat(list).map(v=>`<label><input type="radio" name="${k}" value="${v.id}"${v.id===sel[k]?' checked':''}><span>${pick(v.n)}${v.d?' +'+m(v.d):''}</span></label>`).join('')}</div></fieldset>`;
function open1(id){cur=prod(id);sel={};qty=1;
 if(cur.sz.length)sel.size=(cur.sz.find(v=>v.def)||cur.sz[0]).id;
 cur.gr.forEach(g=>sel[g.k]=((g.o.find(x=>x.def)||(g.req&&g.o[0]))||{}).id||'');
 $('#pdb').innerHTML=`<div class="row"><h2 style="font-size:2rem;margin:0">${pick(cur.n)}</h2><button class="btn ghost x" data-x aria-label="Close">×</button></div><p class="mu" style="margin:0">${pick(cur.d)}</p>`
 +(cur.sz.length?grp('size',s('size'),cur.sz,false):'')+cur.gr.map(g=>grp(g.k,pick(g.n),g.o,!g.req)).join('')
 +`<div class="row"><div class="qty"><button data-q="-1" aria-label="−">−</button><b id="qv"></b><button data-q="1" aria-label="+">+</button></div><button class="btn" id="ad"></button></div>`;
 upd();$('#pd').showModal()}
function addCart(){const k=cur.id+JSON.stringify(sel),x=cart.find(i=>i.k===k);x?x.q=Math.min(50,x.q+qty):cart.push({k,id:cur.id,o:{...sel},q:qty});save();
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)$('#cnt').animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:260})}

$('#pd').onclick=e=>{if(e.target===e.currentTarget)return e.currentTarget.close();const b=e.target.closest('button');if(!b)return;
 if('x' in b.dataset)$('#pd').close();
 else if(b.dataset.q){qty=Math.min(20,Math.max(1,qty+ +b.dataset.q));upd()}
 else if(b.id==='ad'){addCart();$('#pd').close()}};
$('#pd').onchange=e=>{if(e.target.type==='radio'){sel[e.target.name]=e.target.value;upd()}};
$('#grid').onclick=e=>{if(e.target.id==='rt')return load();const b=e.target.closest('[data-p]');if(b)open1(b.dataset.p)};
$('#chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;$$('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.c===cat));grid()};
$('#q').oninput=e=>{q=e.target.value;grid()};
$('#lg').onclick=()=>{lang=ar()?'en':'ar';try{localStorage.setItem('cc_l',lang)}catch(e){}lng()};

$('#cartBtn').onclick=()=>{$('#cv').hidden=false;$('#co').hidden=true;$('#cd').showModal()};
$('#cx').onclick=()=>$('#cd').close();
$('#cd').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close()};
$('#cl').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.r!=null)cart.splice(+b.dataset.r,1);
 else{const i=cart[+b.dataset.a];i.q=Math.min(50,i.q+ +b.dataset.d);if(i.q<1)cart.splice(+b.dataset.a,1)}save()};
$('#go').onclick=()=>{$('#cv').hidden=true;$('#co').hidden=false};
$('#bk').onclick=()=>{$('#co').hidden=true;$('#cv').hidden=false};
$('#co').onchange=e=>{if(e.target.name==='type')$('#adr').hidden=$('#di').hidden=e.target.value!=='delivery'};
// The discount is only a preview. The database checks the code again and calculates the final total when the order is placed.
$('#da').onclick=async()=>{const c=$('#dc').value.trim(),dm=$('#dm');dcode=null;disc=0;dm.textContent='';
 if(c){try{const r=await api('rpc/discount_for',{p_code:c,p_subtotal:subtotal()/1000});dcode=c;disc=fils(r[0].amount)}
  catch(e){dm.textContent=s(e.message==='discount_min_order'?'discMin':'noDisc')}}
 paint()};

$('#co').onsubmit=async e=>{e.preventDefault();
 const f=new FormData(e.target),t=f.get('type'),v=k=>(f.get(k)||'').trim(),er=$('#er'),el=e.target.elements,btn=$('#sb');
 const bad=!v('name')?'name':!v('phone')?'phone':(t==='delivery'&&!v('addr'))?'addr':null;
 if(bad){er.textContent=s('eReq');el[bad].focus();return}
 if(!/^\+?[0-9 ()-]{8,16}$/.test(v('phone'))){er.textContent=s('ePh');el.phone.focus();return}
 er.textContent='';btn.disabled=true;
 // Only ids, options and quantities are sent. The database works out every price.
 const payload={customer:{name:v('name'),phone:v('phone')},order_type:t,address:t==='delivery'?v('addr'):null,notes:v('notes')||null,payment_method:'cash',discount_code:dcode,
  items:cart.map(i=>({product_id:i.id,variant_id:i.o.size||null,quantity:i.q,option_ids:Object.entries(i.o).filter(([k,x])=>k!=='size'&&x).map(([k,x])=>x)}))};
 try{const r=await api('rpc/place_order',{payload}),ph=v('phone');
  cart=[];save();e.target.reset();$('#adr').hidden=$('#di').hidden=true;$('#cd').close();
  const tf=$('#tf').elements;tf.ref.value=r.reference;tf.phone.value=ph;await trackNow();$('#track').scrollIntoView()}
 catch(x){const k=x.message;
  er.textContent=s(k==='invalid_phone'?'ePh':k==='delivery_min_order'?'dMin':k==='invalid_discount'?'noDisc':k==='discount_min_order'?'discMin'
   :/^(product_unavailable|out_of_stock|invalid_option|option_required|option_conflict|invalid_variant|variant_required)$/.test(k)?'itemGone':'fail');
  if(k==='product_unavailable'||k==='out_of_stock')load()}
 btn.disabled=false};

// Order tracking reads the real status from the database and checks again every 10 seconds.
const FL=['new','confirmed','preparing','ready','out_for_delivery','completed'];
async function trackNow(){const f=$('#tf').elements,box=$('#tr');clearInterval(tm);
 try{const r=await api('rpc/track_order',{p_reference:f.ref.value.trim(),p_phone:f.phone.value.trim()});
  if(!r.length){box.textContent=s('notFound');return}
  const o=r[0],steps=FL.filter(x=>x!=='out_for_delivery'||o.order_type==='delivery'),at=steps.indexOf(o.status);
  box.innerHTML=`<p><b>${o.reference}</b> · ${m(fils(o.total))}</p>`
   +(o.status==='cancelled'?`<p class="cx">${s('st_cancelled')}</p>`:`<ol class="steps">${steps.map((x,i)=>`<li class="${i<at?'done':i===at?'now':''}"${i===at?' aria-current="step"':''}>${s('st_'+x)}</li>`).join('')}</ol>`)
   +`<p class="mu">${s('keep')}</p>`;
  try{sessionStorage.setItem('cc_t',JSON.stringify([f.ref.value.trim(),f.phone.value.trim()]))}catch(e){}
  if(!['completed','cancelled'].includes(o.status))tm=setInterval(()=>trackNow(),10000)}
 catch(e){box.textContent=s('fail')}}
$('#tf').onsubmit=e=>{e.preventDefault();trackNow()};

lng();load();
window.addEventListener('focus',()=>load());
setInterval(()=>{if(!document.hidden)load()},60000);
// Refresh the status as soon as the tab is visible again, and restore the last tracked order after a reload.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#tf').elements.ref.value)trackNow()});
try{const t=JSON.parse(sessionStorage.getItem('cc_t')||'null');if(t){const f=$('#tf').elements;f.ref.value=t[0];f.phone.value=t[1];trackNow()}}catch(e){}
</script>
</body>
</html>
