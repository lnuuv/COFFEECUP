<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>COFFEECUP — Specialty Coffee Shop</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Cairo:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F8F6F2;
            --sf: #fff;
            --sf2: #F2E9DC;
            --tx: #171717;
            --mu: #5f5a54;
            --ln: #d8c5ae;
            --cu: #8f5420;
            --cb: #D18A4A;
            --hd: "Barlow Condensed", "Arial Narrow", sans-serif;
            --bd: "Barlow", system-ui, sans-serif;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #090909;
                --sf: #171717;
                --sf2: #242424;
                --tx: #F2E9DC;
                --mu: #929292;
                --ln: #333;
                --cu: #D18A4A
            }
        }

        :root[data-theme="dark"] {
            --bg: #090909;
            --sf: #171717;
            --sf2: #242424;
            --tx: #F2E9DC;
            --mu: #929292;
            --ln: #333;
            --cu: #D18A4A
        }

        :root[lang=ar] {
            --hd: "Cairo", sans-serif;
            --bd: "Cairo", sans-serif
        }

        :root[lang=ar] * {
            letter-spacing: 0 !important
        }

        html {
            scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px)
        }

        @media(prefers-reduced-motion:no-preference) {
            html {
                scroll-behavior: smooth
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 400 1rem/1.55 var(--bd)
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: env(safe-area-inset-top, 0px);
            background: var(--bg);
            z-index: 10
        }

        [hidden] {
            display: none !important
        }

        :focus-visible {
            outline: 2px solid var(--cb);
            outline-offset: 2px
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 20;
            background: var(--bg);
            border-bottom: 1px solid var(--ln)
        }

        .bar,
        .hero,
        section {
            max-width: 1120px;
            margin: 0 auto
        }

        .bar {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px
        }

        .logo {
            font: 700 1.7rem var(--hd);
            letter-spacing: .05em;
            color: var(--tx);
            text-decoration: none
        }

        .logo b {
            color: var(--cu)
        }

        nav {
            margin-inline-start: auto;
            display: flex;
            align-items: center;
            gap: 14px
        }

        nav a {
            color: var(--tx);
            text-decoration: none;
            font-weight: 500
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            background: var(--cb);
            color: #090909;
            border: 1px solid var(--cb);
            border-radius: 6px;
            padding: .65rem 1.1rem;
            font: 600 1rem var(--bd);
            cursor: pointer;
            text-decoration: none
        }

        .btn:hover {
            filter: brightness(1.08)
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed
        }

        .ghost {
            background: transparent;
            color: var(--tx);
            border-color: var(--ln)
        }

        .w {
            width: 100%
        }

        #cnt {
            display: inline-grid;
            place-items: center;
            min-width: 1.5rem;
            height: 1.5rem;
            border-radius: 99px;
            background: #090909;
            color: #F2E9DC;
            font-size: .85rem
        }

        .hero {
            padding: 56px 20px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 40px;
            align-items: center
        }

        .hero>div {
            animation: up .7s both
        }

        .hero>div+div {
            animation-delay: .15s
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(14px)
            }
        }

        h1 {
            font: 700 clamp(3rem, 8.5vw, 6rem)/.92 var(--hd);
            text-transform: uppercase;
            margin: 0 0 .35em
        }

        .lead {
            color: var(--mu);
            font-size: 1.15rem;
            max-width: 32ch;
            margin: 0 0 1.5rem
        }

        .lc {
            background: #F2E9DC;
            border-radius: 14px;
            padding: 22px;
            border: 1px solid var(--ln)
        }

        .lc img {
            width: 100%;
            height: auto;
            display: block;
            mix-blend-mode: multiply
        }

        section {
            padding: 40px 20px
        }

        h2 {
            font: 700 2.4rem/1 var(--hd);
            text-transform: uppercase;
            margin: 0 0 18px
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px
        }

        .chips {
            flex-basis: 100%;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px
        }

        .chip {
            border: 1px solid var(--ln);
            background: transparent;
            color: var(--tx);
            border-radius: 99px;
            padding: .4rem .95rem;
            cursor: pointer;
            white-space: nowrap;
            font: 500 .95rem var(--bd)
        }

        .chip[aria-pressed=true] {
            background: var(--cb);
            border-color: var(--cb);
            color: #090909
        }

        input:not([type=radio]),
        textarea {
            font: inherit;
            color: var(--tx);
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: .6rem .8rem;
            width: 100%
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px
        }

        .card {
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .card:hover {
            border-color: var(--cb)
        }

        .art {
            aspect-ratio: 4/3;
            background: var(--sf2);
            display: grid;
            place-items: center;
            color: var(--cu)
        }

        .art svg {
            width: 36%;
            height: auto
        }

        .art.sm {
            width: 48px;
            height: 48px;
            aspect-ratio: auto;
            border-radius: 6px
        }

        .art.sm svg {
            width: 60%
        }

        .cb {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1
        }

        .cb h3 {
            font: 700 1.35rem var(--hd);
            margin: 0
        }

        .cb p {
            color: var(--mu);
            margin: 0;
            font-size: .92rem;
            flex: 1
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px
        }

        .mu {
            color: var(--mu);
            font-size: .9rem
        }

        .tag {
            color: var(--mu);
            font-weight: 600
        }

        .three {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px
        }

        .three>div {
            border-top: 2px solid var(--cb);
            padding-top: 14px
        }

        .three h3 {
            font: 700 1.5rem var(--hd);
            margin: 0 0 6px
        }

        .three p {
            margin: 0;
            color: var(--mu)
        }

        footer {
            border-top: 1px solid var(--ln);
            padding: 28px 20px;
            text-align: center;
            color: var(--mu);
            font-size: .9rem
        }

        dialog {
            background: var(--sf);
            color: var(--tx);
            border: 1px solid var(--ln);
            border-radius: 12px;
            padding: 0;
            width: min(480px, calc(100% - 24px));
            max-height: calc(100% - 24px);
            overflow: auto
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, .6)
        }

        dialog.dr {
            margin-block: 0;
            margin-inline: auto 0;
            height: 100%;
            max-height: 100%;
            border-radius: 0;
            width: min(420px, 100%)
        }

        .pad {
            padding: 20px;
            display: grid;
            gap: 14px;
            align-content: start
        }

        .g {
            display: grid;
            gap: 14px
        }

        .x {
            padding: .3rem .75rem
        }

        .opts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border: 0;
            padding: 0;
            margin: 0
        }

        .opts label {
            position: relative;
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: .45rem .8rem;
            cursor: pointer
        }

        .opts input {
            position: absolute;
            opacity: 0;
            pointer-events: none
        }

        .opts label:has(:checked) {
            background: var(--cb);
            border-color: var(--cb);
            color: #090909
        }

        .opts label:has(:focus-visible) {
            outline: 2px solid var(--cb);
            outline-offset: 2px
        }

        fieldset {
            border: 0;
            padding: 0;
            margin: 0
        }

        legend {
            font-weight: 600;
            margin-bottom: 6px;
            padding: 0
        }

        .qty {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--ln);
            border-radius: 6px
        }

        .qty b {
            min-width: 1.8rem;
            text-align: center
        }

        .qty button {
            background: none;
            border: 0;
            color: var(--tx);
            width: 34px;
            height: 34px;
            font-size: 1.2rem;
            cursor: pointer
        }

        .li {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--ln)
        }

        .lnk {
            background: none;
            border: 0;
            color: var(--cu);
            cursor: pointer;
            text-decoration: underline;
            font: inherit;
            padding: 4px 8px
        }

        .f {
            display: grid;
            gap: 4px;
            font-weight: 500
        }

        #er {
            margin: 0;
            font-weight: 600;
            color: var(--cu)
        }

        pre {
            white-space: pre-wrap;
            background: var(--sf2);
            padding: 10px;
            border-radius: 6px;
            font-size: .8rem;
            direction: ltr;
            text-align: left;
            margin: 0
        }

        @media(max-width:760px) {
            .hero {
                grid-template-columns: 1fr;
                padding-top: 28px
            }

            .lc {
                order: -1;
                max-width: 340px
            }
        }

        @media(max-width:560px) {
            nav a {
                display: none
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

        const sv = (b) => '<svg viewBox="0 0 64 64" aria-hidden="true">' + b + '</svg>';
        const G = {
            cup: sv('<path fill="currentColor" d="M10 26h36v12a14 14 0 0 1-14 14h-8a14 14 0 0 1-14-14z"/><path fill="none" stroke="currentColor" stroke-width="4" d="M46 30h3a6 6 0 0 1 0 12h-5"/><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M22 8c-4 5 4 7 0 13M32 8c-4 5 4 7 0 13"/>'),
            glass: sv('<path fill="currentColor" d="M16 16h32l-4 42H20z"/><path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" d="M38 4l-3 14"/>'),
            bake: sv('<ellipse cx="32" cy="44" rx="26" ry="9" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" d="M12 38c4-18 36-18 40 0"/>')
        };
        const gl = c => G[c === 'iced' ? 'glass' : ['des', 'bak', 'off'].includes(c) ? 'bake' : 'cup'];

        const $ = x => document.querySelector(x), $$ = x => [...document.querySelectorAll(x)];
        let lang = 'en', cat = 'all', q = '', cart = [], cur, sel, qty;
        try { lang = localStorage.getItem('cc_l') || 'en'; cart = JSON.parse(localStorage.getItem('cc_c') || '[]') } catch (e) { }
        const ar = () => lang === 'ar', s = k => S[k][+ar()], pick = a => a[+ar()];
        const m = c => { const v = (c / 100).toFixed(2); return ar() ? v + ' د.أ' : 'JD ' + v };
        const prod = id => PR.find(p => p.id == id);
        cart = cart.filter(i => { const p = prod(i.id); return p && p.ok });
        const price = (p, o) => p.p + [...p.f].reduce((t, k) => t + OPT[k].v[o[k]][2], 0);
        const lineP = i => price(prod(i.id), i.o) * i.q;
        const summ = i => [...prod(i.id).f].filter(k => !(k === 'e' && !i.o.e)).map(k => pick(OPT[k].v[i.o[k]])).join(' · ');

        function chips() { $('#chips').innerHTML = [['all', S.all], ...CATS].map(([k, n]) => `<button class="chip" data-c="${k}" aria-pressed="${k === cat}">${pick(n)}</button>`).join('') }
        function grid() {
            const t = q.trim().toLowerCase();
            const r = PR.filter(p => (cat === 'all' || p.c === cat) && (!t || (p.n[0] + p.n[1] + p.d[0] + p.d[1]).toLowerCase().includes(t)));
            $('#grid').innerHTML = r.length ? r.map(p => `<article class="card"><div class="art">${gl(p.c)}</div><div class="cb"><h3>${pick(p.n)}</h3><p>${pick(p.d)}</p><div class="row"><span class="price">${s('from')} ${m(p.p)}</span>${p.ok ? `<button class="btn" data-p="${p.id}">${s(p.f ? 'cust' : 'addS')}</button>` : `<span class="tag">${s('sold')}</span>`}</div></div></article>`).join('') : `<p>${s('none')}</p>`
        }
        function paint() {
            const n = cart.reduce((t, i) => t + i.q, 0); $('#cnt').textContent = n;
            $('#cl').innerHTML = cart.length ? cart.map((i, x) => { const p = prod(i.id); return `<div class="li"><div class="art sm">${gl(p.c)}</div><div><b>${pick(p.n)}</b><div class="mu">${summ(i)}</div><div class="qty"><button data-a="${x}" data-d="-1" aria-label="−">−</button><b>${i.q}</b><button data-a="${x}" data-d="1" aria-label="+">+</button></div><button class="lnk" data-r="${x}">${s('rm')}</button></div><b>${m(lineP(i))}</b></div>` }).join('') : `<p>${s('empty')}</p>`;
            $('#tt').textContent = m(cart.reduce((t, i) => t + lineP(i), 0)); $('#go').disabled = !cart.length
        }
        function lng() {
            document.documentElement.lang = lang; document.documentElement.dir = ar() ? 'rtl' : 'ltr';
            $$('[data-i]').forEach(e => e.textContent = s(e.dataset.i));
            $('#q').placeholder = s('ph'); $('#q').setAttribute('aria-label', s('ph')); $('#lg').textContent = ar() ? 'EN' : 'ع'; chips(); grid(); paint()
        }
        const save = () => { try { localStorage.setItem('cc_c', JSON.stringify(cart)) } catch (e) { } paint() };

        const upd = () => { $('#qv').textContent = qty; $('#ad').textContent = `${s('add')} · ${m(price(cur, sel) * qty)}` };
        function open1(id) {
            cur = prod(id); sel = {};[...cur.f].forEach(k => sel[k] = OPT[k].d || 0); qty = 1;
            $('#pdb').innerHTML = `<div class="row"><h2 style="font-size:2rem;margin:0">${pick(cur.n)}</h2><button class="btn ghost x" data-x aria-label="Close">×</button></div><p class="mu" style="margin:0">${pick(cur.d)}</p>`
                + [...cur.f].map(k => { const o = OPT[k]; return `<fieldset><legend>${pick(o.n)}</legend><div class="opts">${o.v.map((v, i) => `<label><input type="radio" name="${k}" value="${i}"${i == sel[k] ? ' checked' : ''}><span>${pick(v)}${v[2] ? ' +' + m(v[2]) : ''}</span></label>`).join('')}</div></fieldset>` }).join('')
                + `<div class="row"><div class="qty"><button data-q="-1" aria-label="−">−</button><b id="qv"></b><button data-q="1" aria-label="+">+</button></div><button class="btn" id="ad"></button></div>`;
            upd(); $('#pd').showModal()
        }
        function addCart() {
            const k = cur.id + JSON.stringify(sel), x = cart.find(i => i.k === k); x ? x.q = Math.min(50, x.q + qty) : cart.push({ k, id: cur.id, o: { ...sel }, q: qty }); save();
            if (!matchMedia('(prefers-reduced-motion: reduce)').matches) $('#cnt').animate([{ transform: 'scale(1.5)' }, { transform: 'scale(1)' }], { duration: 260 })
        }

        $('#pd').onclick = e => {
            if (e.target === e.currentTarget) return e.currentTarget.close(); const b = e.target.closest('button'); if (!b) return;
            if ('x' in b.dataset) $('#pd').close();
            else if (b.dataset.q) { qty = Math.min(20, Math.max(1, qty + +b.dataset.q)); upd() }
            else if (b.id === 'ad') { addCart(); $('#pd').close() }
        };
        $('#pd').onchange = e => { if (e.target.type === 'radio') { sel[e.target.name] = +e.target.value; upd() } };
        $('#grid').onclick = e => { const b = e.target.closest('[data-p]'); if (b) open1(b.dataset.p) };
        $('#chips').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; $$('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.c === cat)); grid() };
        $('#q').oninput = e => { q = e.target.value; grid() };
        $('#lg').onclick = () => { lang = ar() ? 'en' : 'ar'; try { localStorage.setItem('cc_l', lang) } catch (e) { } lng() };

        $('#cartBtn').onclick = () => { $('#cv').hidden = false; $('#co').hidden = true; $('#cd').showModal() };
        $('#cx').onclick = () => $('#cd').close();
        $('#cd').onclick = e => { if (e.target === e.currentTarget) e.currentTarget.close() };
        $('#cl').onclick = e => {
            const b = e.target.closest('button'); if (!b) return;
            if (b.dataset.r != null) cart.splice(+b.dataset.r, 1);
            else { const i = cart[+b.dataset.a]; i.q = Math.min(50, i.q + +b.dataset.d); if (i.q < 1) cart.splice(+b.dataset.a, 1) } save()
        };
        $('#go').onclick = () => { $('#cv').hidden = true; $('#co').hidden = false };
        $('#bk').onclick = () => { $('#co').hidden = true; $('#cv').hidden = false };
        $('#co').onchange = e => { if (e.target.name === 'type') $('#adr').hidden = e.target.value !== 'delivery' };
        $('#co').onsubmit = async e => {
            e.preventDefault();
            const f = new FormData(e.target), t = f.get('type'), v = k => (f.get(k) || '').trim(), er = $('#er'), pl = $('#pl'), el = e.target.elements; pl.hidden = true;
            const bad = !v('name') ? 'name' : !v('phone') ? 'phone' : (t === 'delivery' && !v('addr')) ? 'addr' : null;
            if (bad) { er.textContent = s('eReq'); el[bad].focus(); return }
            if (!/^\+?[0-9 ()-]{8,16}$/.test(v('phone'))) { er.textContent = s('ePh'); el.phone.focus(); return }
            er.textContent = '';
            // Only ids, options and quantities are sent. The server must recalculate every price itself.
            const body = { customer: { name: v('name'), phone: v('phone') }, order_type: t, address: t === 'delivery' ? v('addr') : null, notes: v('notes') || null, payment_method: 'cash', items: cart.map(i => ({ product_id: i.id, quantity: i.q, options: i.o })) };
            const api = window.COFFEECUP_API;
            if (!api) { er.textContent = s('noapi'); pl.textContent = JSON.stringify(body, null, 1); pl.hidden = false; return }
            try {
                const r = await fetch(api + '/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                const j = await r.json(); if (!r.ok || !j.reference) throw 0; cart = []; save(); er.textContent = s('ok') + ' ' + j.reference
            }
            catch (x) { er.textContent = s('fail') }
        };
        lng();
    </script>
</body>

</html>
